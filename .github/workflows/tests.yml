# 1.0.10: 這個 repo 先前沒有 CI —— 142 個測試只有在有人手動輸入指令時才跑。
# 治理文件整套建立在「characterization test 會保護你」之上,但 opt-in 的測試
# 保護不了任何東西。這是那個假設的地基。
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip

      # 開發機是 Windows、CI 是 Linux。第一次跑就失敗而本機全綠時,
      # 這幾行是唯一能區分「環境差異」和「程式壞了」的資訊。
      - name: environment
        run: |
          python -VV
          python -c "import platform, sys; print(platform.platform()); print(sys.getdefaultencoding(), sys.getfilesystemencoding())"
          python -c "from zoneinfo import ZoneInfo; [print(z, ZoneInfo(z)) for z in ('America/Los_Angeles','America/New_York','America/Chicago')]"

      - name: install
        run: pip install -r requirements-dev.txt

      # 測試不得依賴 .env 憑證或券商連線。少了這行,漏寫 mock 的測試會在
      # 本機因為讀得到 .env 而通過,在 CI 才炸 —— 那時已經推上去了。
      #
      # -rA 印出每一個測試的結果:CI 失敗時「哪幾個紅」比 traceback 更早需要。
      - name: pytest
        run: python -m pytest tests/ -q -rA --tb=short
        env:
          TOPSTEPX_USERNAME: ''
          TOPSTEPX_API_KEY: ''
          DISCORD_TOKEN: ''

  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      # UI 狀態另由下面的 Chromium job 保護；這個快速 gate 仍先擋住
      # 「區塊替換把括號吃掉」這類編輯事故。
      # ubuntu runner 本身就帶 node,不需要 setup-node。
      - name: node --check on frontend JS
        run: |
          node --version
          for f in frontend/static/*.js; do
            echo "checking $f"
            node --check "$f"
          done

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: install app and browser test dependencies
        run: |
          pip install -r requirements-dev.txt
          npm ci
          node tests/ui/playwright-cli.cjs install --with-deps chromium

      # The Playwright webServer command uses --lifespan off: UI tests must
      # never start the candle accumulator or the daily shadow-replay task.
      - name: Chromium UI state tests
        run: npm run test:ui
        env:
          TOPSTEPX_USERNAME: ''
          TOPSTEPX_API_KEY: ''
          DISCORD_TOKEN: ''
